<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primary Care Work System | รพ.โพนนาแก้ว</title><link rel="stylesheet" href="style.css"></head><body><aside class="sidebar"><div class="brand"><div class="logo">PC</div><div><strong>Primary Care</strong><small>รพ.โพนนาแก้ว</small></div></div><nav><a data-page="dashboard" class="active">📊 Dashboard</a><a data-page="tasks">📋 งานทั้งหมด</a><a data-page="modules">🗂️ 13 กลุ่มงาน</a><a data-page="calendar">📅 ปฏิทินงาน</a><a data-page="kpi">🎯 KPI</a><a data-page="reports">📑 รายงาน</a><a data-page="settings">⚙️ ตั้งค่าระบบ</a></nav><div class="footer">ระบบบริหารงาน<br>กลุ่มงานบริการด้านปฐมภูมิและองค์รวม</div></aside><main><header><div><span class="eyebrow">HOSPITAL WORK MANAGEMENT</span><h1 id="pageTitle">Dashboard</h1><p>โรงพยาบาลโพนนาแก้ว</p></div><div class="header-actions"><button class="secondary" onclick="show('tasks')">🔎 ค้นหางาน</button><button class="primary" onclick="newTask()">＋ เพิ่มงานใหม่</button></div></header><div id="content"></div></main><div id="modal" class="modal hidden"><div class="modal-box"><div class="panel-title"><h2>เพิ่มงานใหม่</h2><button onclick="closeModal()">✕</button></div><form id="taskForm"><label>ชื่องาน<input id="taskName" required placeholder="เช่น ติดตามผู้ป่วย Home Visit"></label><label>กลุ่มงาน<select id="taskModule"></select></label><label>ผู้รับผิดชอบ<input id="taskOwner" required placeholder="ชื่อ/ทีมผู้รับผิดชอบ"></label><label>กำหนดส่ง<input id="taskDue" type="date" required></label><label>สถานะ<select id="taskStatus"><option>ยังไม่เริ่ม</option><option>กำลังดำเนินการ</option><option>รอติดตาม</option><option>เสร็จสิ้น</option></select></label><label>รายละเอียด<textarea id="taskDetail" rows="3" placeholder="รายละเอียดหรือหมายเหตุ"></textarea></label><div class="actions"><button type="button" onclick="closeModal()">ยกเลิก</button><button class="primary">บันทึกงาน</button></div></form></div></div><script src="app.js"></script></body></html>
